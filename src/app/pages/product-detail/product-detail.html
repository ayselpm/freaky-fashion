@if (product) {
  <div style="
    max-width: 1000px;
    margin: 50px auto;
    padding: 20px;
    font-family: Arial, sans-serif;
  ">

    <!-- Produkt -->
    <div style="
      display: flex;
      gap: 50px;
      align-items: flex-start;
      flex-wrap: wrap;
    ">

      <div style="flex: 1; min-width: 280px;">
        <img
          [src]="product.imageUrl"
          [alt]="product.title"
          style="
            width: 100%;
            max-width: 400px;
            height: 450px;
            object-fit: cover;
            border-radius: 5px;
          "
        >
      </div>

      <div style="flex: 1; min-width: 280px;">

        <h1>{{ product.title }}</h1>

        <p style="color: #666;">
          {{ product.brand }}
        </p>

        <p style="font-size: 17px;">
          {{ product.description }}
        </p>

        <p style="
          font-weight: bold;
          font-size: 22px;
          margin: 25px 0;
        ">
          {{ product.price }} kr
        </p>

        <form (submit)="addToCart($event)">
          <button
            type="submit"
            style="
              padding: 12px 24px;
              background-color: #222;
              color: white;
              border: none;
              border-radius: 4px;
              cursor: pointer;
              font-size: 16px;
            "
          >
            Lägg i varukorg
          </button>
        </form>

        <div style="margin-top: 30px;">
          <a routerLink="/">← Till startsidan</a>
          &nbsp; | &nbsp;
          <a routerLink="/cart">Till varukorgen →</a>
        </div>

      </div>

    </div>


    <!-- Liknande produkter -->
    <section style="margin-top: 70px;">

      <h2 style="text-align: center; margin-bottom: 30px;">
        Liknande produkter
      </h2>

      <div style="
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
      ">

        <div
          *ngFor="let item of similarProducts"
          style="
            border: 1px solid #ddd;
            padding: 15px;
          "
        >

          <a
            [routerLink]="['/products', item.slug]"
            style="text-decoration: none; color: inherit;"
          >

            <img
              [src]="item.imageUrl"
              [alt]="item.title"
              style="
                width: 100%;
                height: 250px;
                object-fit: cover;
              "
            >

            <h3>{{ item.title }}</h3>

            <p>{{ item.brand }}</p>

            <p style="font-weight: bold;">
              {{ item.price }} kr
            </p>

          </a>

        </div>

      </div>

    </section>

  </div>
}
