<div class="container">

  <h1>Sökresultat</h1>

  <p>
    Hittade {{ products.length }} produkter
  </p>

  <div class="products-grid">

    <div
      class="product-card"
      *ngFor="let product of products"
    >
      <img
        [src]="product.imageUrl"
        [alt]="product.title"
      >

      <h3>{{ product.title }}</h3>

      <p>{{ product.brand }}</p>

      <p class="price">
        {{ product.price }} kr
      </p>

      <a
        [routerLink]="['/products', product.slug]"
        class="btn"
      >
        Visa produkt
      </a>
    </div>

  </div>

  <p *ngIf="products.length === 0">
    Inga produkter hittades.
  </p>

</div>
